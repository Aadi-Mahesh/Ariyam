<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <title>Ariyam - Kerala STEM Map</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <button
        id="toggle-btn"
        onclick="toggleDarkMode()"
        class="absolute top-4 right-4 z-[1000] bg-white px-4 py-2 rounded-xl shadow-lg">
        Make it Night!
    </button>

    <div class="absolute top-3 left-14 z-[1000] bg-white p-4 rounded-xl shadow-lg flex flex-col gap-2 w-64">
        <h2 class="text-lg font-bold mb-2"> Filter through: </h2>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="Robotics" onchange="filterLocation()"> Robotics
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="Space" onchange="filterLocation()"> Space
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="Science Centre" onchange="filterLocation()"> Science Centre
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="Deep Tech" onchange="filterLocation()"> Deep Tech
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="Biotech" onchange="filterLocation()"> Biotech
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="Marine Science" onchange="filterLocation()"> Marine Science
        </div>
    </div>

    <div id="map" style="height:100vh; width:100%;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const map = L.map('map').setView([10.8505, 76.2711], 7);

        const lightLayer = L.tileLayer(
            'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap contributors'
            }
        );

        const darkLayer = L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            {
                attribution: '&copy; OpenStreetMap & CARTO contributors'
            }
        );

        lightLayer.addTo(map);

        let darkMode = false;

        function toggleDarkMode() {
            if (darkMode) {
                map.removeLayer(darkLayer);
                lightLayer.addTo(map);
                document.getElementById('toggle-btn').textContent = 'Make it Night!';
            } else {
                map.removeLayer(lightLayer);
                darkLayer.addTo(map);
                document.getElementById('toggle-btn').textContent = 'Make it Day!';
            }

            darkMode = !darkMode;
        }

        async function loadLocs() {
            try {
                const resp = await fetch('map_locs.json');

                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                
                const locations = await resp.json();

                locations.forEach(loc => {
                    const marker = L.marker(loc.coords).addTo(map);
                    loc.marker = marker;
                    marker.bindPopup(`
                        ${loc.img ? `<img src="${loc.img}" style="width:150px; border-radius:8px; margin-bottom:6px; display:block;">` : ''}
                        <b style="font-size:14px; font-family:sans-serif;">${loc.name}</b>
                        <div style="font-size:12px; margin-top:6px; line-height:1.4;">
                            ${loc.desc || ''}
                        </div>
                    `);
                });

                window.locations = locations;
                filterLocation();

            } catch (err) {
                console.error('Failed to load locations:', err);
                window.locations = [];
            }
        }

        loadLocs();

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    map.setView([lat, lng], 13);

                    L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup("You are here!")
                        .openPopup();
                },
                (err) => {
                    console.warn(`Geolocation error (${err.code}): ${err.message}`);
                },
                { timeout: 20000 }
            );
        } else {
            console.warn("Geolocation is not supported by this browser.");
        }

        function filterLocation() {
            const locations = window.locations || [];
            const selectedTypes = [];

            ["Robotics", "Space", "Science Centre", "Deep Tech", "Biotech", "Marine Science"].forEach(type => {
                const checkbox = document.getElementById(type);
                if (checkbox && checkbox.checked) {
                    selectedTypes.push(type);
                }
            });

            const showAll = selectedTypes.length === 0;

            locations.forEach(loc => {
                if (showAll || selectedTypes.includes(loc.type)) {
                    loc.marker.addTo(map);
                } else {
                    map.removeLayer(loc.marker);
                }
            });
        }
    </script>
</body>
</html>
