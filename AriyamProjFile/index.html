
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./src/output.css" rel="stylesheet">
    <title>Ariyam - Kerala STEM Map</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>

<body>

<style>
    html.dark .leaflet-popup-content-wrapper,
    html.dark .leaflet-popup-tip {
        background-color: #050a04; /* Dark background */
        color: #f8fafc; /* Light text */
    }
    </style>
    <div id="welcome-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm"
     style="position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;">
        <div class="dark:bg-slate-900/60 text-gray-900 dark:text-gray-100 p-6 rounded-xl shadow-2xl w-[50vw] min-h-[55vh] text-center backdrop-blur-sm border border-white/10 dark:border-black/20 transition-colors duration-300">
            <h2 class="text-3xl font-bold mb-4 tracking-[0.2em] text-gray-900 dark:text-gray-100">
                Welcome to Ariyam!</h2>
            <p class="mb-6 text-lg leading-relaxed text-gray-700 dark:text-gray-300">
                Explore the STEM locations in Kerala. Use the search box and filters to find what you're looking for.</p>
                <div class="inline-block rounded-full p-[2px] bg-gradient-to-r from-blue-500 via-purple-500 to-rose-500 mb-6">
                <button id="modalclose" onclick="closeModal()"
             class="rounded-full px-6 py-2 bg-white/95 dark:bg-slate-800 text-gray-900 dark:text-white font-semibold shadow-md transition hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-400">
                    Get Started
                </button>
                </div>
        </div>
</div>

            <button
        id="toggle-btn"
        onclick="toggleDarkMode()"
        class="absolute top-4 right-4 z-[1000] bg-white dark:bg-slate-800 dark:text-gray-100 px-4 py-2 rounded-2xl shadow-xl backdrop-blur-sm transition-colors duration-300">
        Make it Night!
    </button>

    <input type="text" id="search-box" placeholder="Search for a location..." class="absolute top-4 left-15 md:left-15 z-[1000] bg-white/60 dark:bg-slate-900/60 text-gray-900 dark:text-gray-100 px-4 py-2 rounded-xl shadow-lg backdrop-blur-sm border border-white/10 dark:border-black/20 transition-colors duration-300 w-64 focus:outline-none">



    <!-- Filter Panel -- Need to Change -->
    <div class="absolute top-16 left-15 md:left-15 z-[3000] bg-white/60 dark:bg-slate-900/60 dark:text-gray-100 p-4 rounded-xl shadow-lg flex flex-col gap-2 w-64 backdrop-blur-sm border border-white/10 dark:border-black/20 transition-colors duration-300">
        <h2 class="text-sm font-semibold mb-2 tracking-[0.2em] text-gray-900 dark:text-gray-100"> Filter through: </h2>
        <div class="flex items-center gap-2">
            <label class="flex items-center gap-2">
                <input type="checkbox" id="filter-robotics" data-type="Robotics" onchange="filterLocation()" > Robotics</label>
        </div>
        <div class="flex items-center gap-2">
            <label class="flex items-center gap-2">
                <input type="checkbox" id="filter-space" data-type="Space" onchange="filterLocation()"   > Space</label>
        </div>
        <div class="flex items-center gap-2">
            <label class="flex items-center gap-2">
                <input type="checkbox" id="filter-science-centre" data-type="Science Centre" onchange="filterLocation()" > Science Centre</label>
        </div>
        <div class="flex items-center gap-2">   
            <label class="flex items-center gap-2">
                <input type="checkbox" id="filter-deep-tech" data-type="Deep Tech" onchange="filterLocation()" > Deep Tech</label>
        </div>
        <div class="flex items-center gap-2">
            <label class="flex items-center gap-2">
                <input type="checkbox" id="filter-biotech" data-type="Biotech" onchange="filterLocation ()" > Biotech</label>
        </div>
        <div class="flex items-center gap-2">
            <label class="flex items-center gap-2">
                <input type="checkbox" id="filter-marine-science" data-type="Marine Science" onchange="filterLocation()" > Marine Science</label>
        </div>
    </div>


    <div id="map" style="height:100vh; width:100%;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  

    <script type="module">

            import Fuse from './vendor/fuse.min.mjs';
             
                              const typeIcons = {
    "Robotics": "./icons/robotics.svg",
    "Space": "./icons/space.svg",
    "Science Centre": "./icons/sciencec.svg",
    "Deep Tech": "./icons/dtech.svg",
    "Biotech": "./icons/biotech.svg",
    "Marine Science": "./icons/marine.svg"
};
       function closeModal() {
            document.getElementById('welcome-modal').style.display = 'none';


        }
        window.closeModal = closeModal;
            const map = L.map('map').setView([10.8505, 76.2711], 7);

        const lightLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });

        const darkLayer = L.tileLayer(
            'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            {
                attribution: '&copy; OpenStreetMap & CARTO contributors'
            }
        );

        lightLayer.addTo(map);

       
        let darkMode = localStorage.getItem('darkMode') === 'true';

        function applyDarkModeState() {
            if (darkMode) {
                document.documentElement.classList.add('dark');
                if (map.hasLayer(lightLayer)) map.removeLayer(lightLayer);
                darkLayer.addTo(map);
                document.getElementById('toggle-btn').textContent = 'Make it Day!';
            } else {
                document.documentElement.classList.remove('dark');
                if (map.hasLayer(darkLayer)) map.removeLayer(darkLayer);
                lightLayer.addTo(map);
                document.getElementById('toggle-btn').textContent = 'Make it Night!';
            }
            localStorage.setItem('darkMode', darkMode);
        }

        function toggleDarkMode() {
            darkMode = !darkMode;
            applyDarkModeState();
        }

        window.toggleDarkMode = toggleDarkMode;

        // apply initial state
        applyDarkModeState();
 
        async function loadLocs() {
            try {
                const resp = await fetch('map_locs.json');

                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                
                const locations = await resp.json();
        

                locations.forEach(loc => {
                
         
                const icon = L.divIcon({
                    html: `<img src="${typeIcons[loc.type] || './icons/default.svg'}" style="width:30px; height:30px;">`,
                    className: '',
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });

                const marker = L.marker(loc.coords,  {
                   icon: icon
                }).addTo(map);
                    loc.marker = marker;
                    marker.bindPopup(`
                        ${loc.img ? `<img src="${loc.img}" style="width:150px; border-radius:8px; margin-bottom:6px; display:block;">` : ''}
                        <b style="font-size:14px; font-family:sans-serif;">${loc.name}</b>
                        <div style="font-size:12px; margin-top:6px; line-height:1.4;">
                            ${loc.desc || ''}
                        </div>
                    `);
                });

                window.locations = locations;
                
                //copy paste changed location of ts
           // ensure each loc has an id

             window.locations.forEach((loc, idx) => {
                      loc.id = loc.id || `loc-${idx}`; 
});


        // initialize Fuse after locations are set
        const fuseSearch = new Fuse(window.locations, {
            keys: ['name', 'desc', 'type'],
            threshold: 0.4,
            includeScore: true,
        });
        window.fuseSearch = fuseSearch;
          filterLocation(); 
        // debounce helper
        function debounce(fn, wait = 180) {
            let t;
            return function(...args) {
                clearTimeout(t);
                t = setTimeout(() => fn.apply(this, args), wait);
            };
        }

        const searchBox = document.getElementById('search-box');
        searchBox.addEventListener('input', debounce((e) => {
            const q = (e.target.value || '').trim();
            const results = q ? fuseSearch.search(q).map(r => r.item) : window.locations;
            applySearchResults(results, q);
        }, 180));

        // unified visibility function: accepts raw items
        

            } catch (err) {
                console.error('Failed to load locations:', err);
                window.locations = [];
            }
        }
              
        loadLocs();
        
        function applySearchResults(items, query) {
            
            const matchingIds = new Set(items.map(i => i.id));
                 
            const checkboxes = document.querySelectorAll('input[type="checkbox"][data-type]');
            const selectedTypes = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.getAttribute('data-type'));
            const showAllTypes = selectedTypes.length === 0;
            const showAllSearch = query === '';

            (window.locations || []).forEach(loc => {
                const passesSearch = showAllSearch || matchingIds.has(loc.id);
                const passesType = showAllTypes || selectedTypes.includes(loc.type);
                if (passesSearch && passesType) {
                    loc.marker.addTo(map);
                } else if (loc.marker && map.hasLayer(loc.marker)) {
                    map.removeLayer(loc.marker);
                }
            });
        }
        


        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    map.setView([lat, lng], 13);

                         const userIcon = L.divIcon({
                                                       html: `<img src="./icons/location.svg" style="width:30px; height:30px;">`,
                                                      className: '',
                                                        iconSize: [40, 40],
                                                        iconAnchor: [15, 15]
                                                    });

                    const userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
                    userMarker.bindPopup("You are here!").openPopup();
                },
                (err) => {
                    console.warn(`Geolocation error (${err.code}): ${err.message}`);
                },
                { timeout: 20000 }
            );
        } else {
            console.warn("Geolocation is not supported by this browser.");
        }

        // Can be changed to support any given loc? 26/7/26.
        //changed 27/7/26 to support any given loc
        //Change to compute search and call applysearchreults 13/8/26

        function filterLocation() {
        const q = document.getElementById('search-box').value.trim();
         
        const results = q ? window.fuseSearch.search(q).map(r => r.item)
         : window.locations;
        applySearchResults(results, q);

        
        }

        window.filterLocation = filterLocation;

        function searchBoxListen() {

        }
         
        
           //ta daaa, the end


      
    </script>
</body>
</html>
